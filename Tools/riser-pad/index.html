<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Riser Pad Generator — Longboard Technology</title>
  <link rel="stylesheet" href="/shared.css">
  <style>
    /* Page-specific tokens — most live in /shared.css now.
       These map the page's old names onto the site palette. */
    :root {
      --bg:       var(--navy);
      --surface2: var(--surface-2);
      --border:   var(--border-mid);
      /* --accent already cascades from shared.css */
      --sidebar:  var(--sidebar-w);
    }

    html, body { overflow: hidden; }

    /* ── App shell — page-local because riser pad uses 100% height ──────── */
    .app {
      display: flex; flex-direction: column;
      height: 100%;
      padding-top: var(--nav-h);
      max-width: 100vw;
      overflow: hidden;
    }

    /* Generator sub-header */
    .gen-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border-mid);
      flex-shrink: 0;
    }
    .gen-header h1 {
      font-family: var(--display);
      font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* Unit toggle */
    .unit-toggle {
      display: flex; border: 1px solid var(--border-mid);
      border-radius: 4px; overflow: hidden;
    }
    .unit-btn {
      padding: 5px 12px;
      font-family: var(--display);
      font-size: 0.6rem; font-weight: 700;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; transition: all 0.15s;
    }
    .unit-btn.active { background: var(--accent); color: var(--navy); }

    .body { display: flex; flex: 1; overflow: hidden; min-height: 0; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar); flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar-inner {
      padding: 16px;
      display: flex; flex-direction: column; gap: 18px;
      width: 100%; min-width: 0;
    }

    .section-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
    }

    /* Pattern buttons — mirrors pivot cup .mode-grid / .mode-btn so both
       generators share the same square-card selector idiom. */
    .pattern-group {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    }
    .pattern-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 4px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2);
      font-family: var(--mono); font-size: 0.65rem; color: var(--text-mid);
      transition: all 0.15s; text-align: center; line-height: 1.2;
      min-width: 0;
    }
    .pattern-btn:hover { border-color: var(--border-mid); color: var(--text); }
    .pattern-btn.active {
      border-color: var(--accent); background: var(--accent-dim); color: var(--accent);
    }
    .pattern-icon { font-size: 1.2rem; line-height: 1; }

    /* Library pull-down */
    .library-section { display: flex; flex-direction: column; gap: 0; }
    .library-toggle {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2);
      font-family: var(--mono); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim);
      transition: all 0.15s;
    }
    .library-toggle:hover { border-color: var(--border-mid); color: var(--text); }
    .library-toggle.has-active { border-color: var(--accent); color: var(--accent); }
    .library-chevron { font-size: 0.8rem; transition: transform 0.2s; line-height: 1; }
    .library-chevron.open { transform: rotate(180deg); }
    .library-drawer {
      overflow: hidden; max-height: 0;
      transition: max-height 0.25s ease;
    }
    .library-drawer.open { max-height: 240px; overflow-y: auto; }
    .library-drawer-inner {
      padding: 4px 0 2px;
      display: flex; flex-direction: column; gap: 2px;
    }
    .library-item {
      padding: 7px 10px; border-radius: 5px; cursor: pointer;
      font-family: var(--mono); font-size: 0.7rem; color: var(--text-mid);
      transition: all 0.15s; border: 1px solid transparent;
    }
    .library-item:hover { color: var(--text); background: var(--surface-2); border-color: var(--border); }
    .library-item.active {
      color: var(--accent); background: var(--accent-dim); border-color: var(--accent);
    }
    .library-empty {
      padding: 8px 10px;
      font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim);
      font-style: italic;
    }

    .control-row { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
    .control-header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 6px; min-width: 0;
    }
    .control-name-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; flex-shrink: 1; }
    .control-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; }
    .clamp-label {
      font-size: 0.65rem; font-weight: 700; color: var(--err);
      display: none; white-space: nowrap; flex-shrink: 0;
    }
    .clamp-label.visible { display: inline; }
    .control-value {
      font-size: 0.82rem; font-weight: 600; color: var(--accent);
      font-variant-numeric: tabular-nums; white-space: nowrap;
      flex-shrink: 0; text-align: right;
    }

    /* Slider — markers come from shared.css (.slider-marker.is-min / .is-max).
       Track is a CSS-var-driven gradient: the portion of the track inside the
       active clamp window (--clamp-min-pct → --clamp-max-pct, set per-slider
       by shared.js) uses --border; outside the clamps it dims so you can SEE
       the dead zones rather than hitting them by surprise. Both vars default
       to 0%/100% if shared.js hasn't pushed values yet. Mirrors pivot cup. */
    .slider-wrap { position: relative; }
    .slider-wrap input[type=range] { display: block; width: 100%; }

    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 5px;
      border-radius: 4px; outline: none; cursor: pointer;
      --clamp-min-pct: 0%;
      --clamp-max-pct: 100%;
      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.20) 0%,
          rgba(0, 0, 0, 0.20) var(--clamp-min-pct),
          var(--border)       var(--clamp-min-pct),
          var(--border)       var(--clamp-max-pct),
          rgba(0, 0, 0, 0.20) var(--clamp-max-pct),
          rgba(0, 0, 0, 0.20) 100%
        );
    }
    /* Thumb — small white dot. .active (toggled by shared.js on the most-
       recently-interacted slider) bumps it up a notch and overlays a soft
       green glow that fades into the white — recency marker + center hint. */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--white); border: 2px solid var(--bg);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.25); cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%; background: var(--white); border: 2px solid var(--bg);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.25); cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }
    input[type=range].active::-webkit-slider-thumb {
      width: 17px; height: 17px;
      background:
        radial-gradient(circle at center,
                        rgba(30, 199, 61, 0.55) 0%,
                        rgba(30, 199, 61, 0)   70%),
        var(--white);
    }
    input[type=range].active::-moz-range-thumb {
      width: 17px; height: 17px;
      background:
        radial-gradient(circle at center,
                        rgba(30, 199, 61, 0.55) 0%,
                        rgba(30, 199, 61, 0)   70%),
        var(--white);
    }
    input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.15); box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
    input[type=range]:hover::-moz-range-thumb     { transform: scale(1.15); box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
    /* Clamped — stored value is pinned by an active soft-clamp. White dims so
       the thumb reads "you can't push past this." Active+clamped keeps the
       green glow (recency signal) and only darkens the surrounding white. */
    input[type=range].clamped::-webkit-slider-thumb {
      background: rgba(255, 255, 255, 0.45);
    }
    input[type=range].clamped::-moz-range-thumb {
      background: rgba(255, 255, 255, 0.45);
    }
    input[type=range].active.clamped::-webkit-slider-thumb {
      background:
        radial-gradient(circle at center,
                        rgba(30, 199, 61, 0.55) 0%,
                        rgba(30, 199, 61, 0)   70%),
        rgba(255, 255, 255, 0.45);
    }
    input[type=range].active.clamped::-moz-range-thumb {
      background:
        radial-gradient(circle at center,
                        rgba(30, 199, 61, 0.55) 0%,
                        rgba(30, 199, 61, 0)   70%),
        rgba(255, 255, 255, 0.45);
    }

    /* Angle flip toggle — sits left of the angle value input */
    .angle-sign-wrap { display: flex; align-items: center; gap: 4px; }
    .angle-flip-btn {
      padding: 3px 7px; border-radius: 4px; cursor: pointer;
      border: 1px solid var(--border); background: none;
      font-family: var(--mono); font-size: 0.65rem; font-weight: 700; line-height: 1;
      letter-spacing: 0.05em; text-transform: uppercase;
      color: var(--text-dim); transition: all 0.15s; flex-shrink: 0;
    }
    .angle-flip-btn:hover { border-color: var(--border-mid); color: var(--text); }
    .angle-flip-btn.flipped { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

    .stats-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 11px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.79rem; }
    .stat-label { color: var(--text-dim); }
    .stat-val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat-val.ok   { color: var(--ok); }
    .stat-val.warn { color: var(--warn); }
    .stat-val.err  { color: var(--err); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: none; transition: all 0.15s; min-height: 44px; width: 100%;
    }
    .btn-primary { background: var(--accent); color: var(--navy); font-weight: 700; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-bright); box-shadow: 0 0 14px var(--accent-glow); }
    .btn-primary:disabled { background: var(--surface-3); color: var(--text-faint); cursor: not-allowed; box-shadow: none; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-row { display: flex; flex-direction: column; gap: 8px; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(7, 9, 26, 0.3);
      border-top-color: var(--navy); border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider { height: 1px; background: var(--border); }

    /* ── Viewport ── */
    .viewport { flex: 1; position: relative; background: #0a0c14; overflow: hidden; min-width: 0; }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    .loading-overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: rgba(10,12,20,0.88); z-index: 5;
      opacity: 0; transition: opacity 0.25s; pointer-events: none;
    }
    .loading-overlay.visible { opacity: 1; pointer-events: all; }
    .loading-ring {
      width: 44px; height: 44px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-msg { font-size: 0.85rem; color: var(--text-dim); }

    .viewport-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 0.68rem; color: var(--text-dim); background: rgba(10,12,20,0.7);
      padding: 4px 10px; border-radius: 20px; pointer-events: none; white-space: nowrap;
    }
    .viewport-status {
      position: absolute; top: 12px; left: 12px; font-size: 0.72rem;
      color: var(--text-dim); background: rgba(10,12,20,0.75);
      padding: 4px 10px; border-radius: 20px; pointer-events: none; display: none;
    }

    /* Page load-in cascade — see ltFadeUp in shared.css. Four-step stagger
       buys ~1s of motion while the first preview is generating, hiding the
       moment of dead canvas behind a deliberate entrance. */
    .site-nav   { animation: ltFadeUp 0.8s 0s    both; }
    .gen-header { animation: ltFadeUp 0.8s 0.15s both; }
    .sidebar    { animation: ltFadeUp 0.8s 0.3s  both; }
    .viewport   { animation: ltFadeUp 0.8s 0.45s both; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .body { flex-direction: column-reverse; }
      .sidebar {
        width: 100%; border-right: none;
        border-top: 1px solid var(--border);
        max-height: 52vh; flex-shrink: 0;
      }
      .sidebar-inner { padding: 12px; gap: 14px; }
      .viewport { flex: 1; min-height: 180px; }
      .viewport-hint { display: none; }
      .btn-row { flex-direction: row; }
      .nav-links a { padding: 0 0.5rem; font-size: 0.45rem; }
    }
    @media (min-width: 641px) and (max-width: 900px) { :root { --sidebar: 240px; } }

    /* Editable value input — looks like the value display, acts like a text field */
    .value-input {
      font-size: 0.82rem; font-weight: 600; color: var(--accent);
      font-variant-numeric: tabular-nums; white-space: nowrap;
      flex-shrink: 0; text-align: right;
      background: none; border: none; outline: none;
      width: 84px; padding: 2px 4px; border-radius: 4px;
      cursor: text; font-family: inherit;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }
    /* Threshold colour states for the value input — JS toggles these classes
       on #val-angle as the wedge angle crosses 10° (warn) and 15° (err). The
       same pattern can extend to other values later if needed. Focus state
       still wins over warn/err so editing the value remains visually clear. */
    .value-input.warn { color: var(--warn); }
    .value-input.err  { color: var(--err); }
    .value-input:focus {
      background: var(--surface2);
      border-bottom-color: var(--accent);
      outline: none;
    }
  </style>
</head>

<!-- Site nav -->
<div class="nav-accent-bar"></div>
<nav class="site-nav">
  <canvas class="starfield-nav" aria-hidden="true"></canvas>
  <a class="nav-logo" href="https://longboardtechnology.com">Longboard<span>Technology</span></a>
  <ul class="nav-links">

<div class="app">

  <div class="gen-header">
    <h1>Riser Pad Generator</h1>
    <div class="unit-toggle">
      <button class="unit-btn active" id="btn-mm">mm</button>
      <button class="unit-btn" id="btn-in">in</button>
    </div>
  </div>

  <div class="body">

    <aside class="sidebar">
      <div class="sidebar-inner">

        <!-- Style -->
        <div>
          <div class="section-label">Style</div>
          <div class="pattern-group">
            <button class="pattern-btn active" data-style="Solid">
              <span class="info-btn" role="button" tabindex="0" aria-label="More info" data-tooltip="Solid body — Best for soft Shock Risers, or custom infill.">i</span>
              <span class="pattern-icon">■</span>Solid
            </button>
            <button class="pattern-btn" data-style="Skeleton">
              <span class="info-btn" role="button" tabindex="0" aria-label="More info" data-tooltip="Ribbed body — Best for Solid Infill.">i</span>
              <span class="pattern-icon">▦</span>Skeleton

            <button class="pattern-btn" data-style="Drop-thru">
              <span class="info-btn" role="button" tabindex="0" aria-label="More info" data-tooltip="Drop-through mount — sits below the deck plane.">i</span>
              <span class="pattern-icon">⬓</span>Drop-thru

          </div>
          <div class="library-section" style="margin-top:8px;">

                <span class="library-empty">Loading…</span>

          </div>
        </div>

        <div class="divider"></div>

        <!-- Height -->
        <div>
          <div class="section-label">Dimensions</div>

          <div class="control-row">
            <div class="control-header">

          <div class="control-row" style="margin-top:22px;">

                <span class="clamp-label" id="clamp-angle">Max applied</span>
              </div>
              <div class="angle-sign-wrap">
                <button class="angle-flip-btn" id="btn-flip-angle" type="button" title="Flip wedge direction" aria-label="Flip wedge direction" aria-pressed="false">Flip</button>
                <input class="value-input" id="val-angle" type="text" value="0.0°" aria-label="Wedge angle">
              </div>
            </div>
            <div class="slider-wrap">
              <input type="range" id="slider-angle" min="0" max="20" step="0.5" value="0">
              <div class="slider-marker is-min" id="min-marker-angle"></div>
              <div class="slider-marker is-max" id="max-marker-angle"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Stats -->
        <div>
          <div class="section-label">Geometry</div>
          <div class="stats-card">
            <div class="stat-row">
              <span class="stat-label">Thick end</span>
              <span class="stat-val" id="stat-thick">5.0 mm</span>

            <div class="stat-row">
              <span class="stat-label">Center</span>
              <span class="stat-val" id="stat-center">5.0 mm</span>

            <div class="stat-row">
              <span class="stat-label">Thin end</span>

        <div class="divider"></div>

        <!-- Actions -->
        <div class="btn-row">

          <button class="btn btn-secondary" id="btn-download" disabled>
            Download STL
          </button>
        </div>
        <button class="btn-feedback" id="btn-feedback" type="button">Mission report</button>

      </div>
    </aside>

    <!-- Viewport -->
    <div class="viewport">
      <canvas id="canvas"></canvas>
      <div class="loading-overlay visible" id="loading-overlay">
        <div class="loading-ring"></div>
        <div class="loading-msg" id="loading-msg">Generating preview…</div>
        <div class="loading-sub" id="loading-sub"></div>
      </div>
      <div class="viewport-status" id="viewport-status"></div>
      <div class="viewport-hint" id="viewport-hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/shared.js"></script>
<script>
// ── Constants (must match generators/riser_pad.py) ────────────────────────────
const MIN_WALL    = 0.5;     // mm — min thin-end thickness
const PAD_HALF_LEN = 39.0;   // mm — half length of pad (cutter math)
const SLIDER_MIN_MM = 1;
const SLIDER_MAX_MM = 35;
const TEXT_MIN_MM   = 0.5;
const TEXT_MAX_MM   = 60;

const ANGLE_MIN = 0;
const ANGLE_MAX = 20;

const tanDeg = d => Math.tan(d * Math.PI / 180);
const atanDeg = r => Math.atan(r) * 180 / Math.PI;

// ── Page state ────────────────────────────────────────────────────────────────
const state = {
  style:        'Solid',  // display name — matches STL filename without extension
  heightStored: 5.0,      // mm — what user dragged/typed
  angleStored:  0.0,      // degrees
  heightEff:    5.0,
  angleEff:     0.0,      // magnitude after clamping — always ≥ 0
  flipAngle:    false,    // when true, effective angle is negated before API call
  unit:         'mm',
  stlBlob:      null,
};

// Signed angle — applied after all constraint logic. Only place that reads flipAngle.
function signedAngle() {
  return state.flipAngle ? -state.angleEff : state.angleEff;
}

let dragWinner = null;   // 'height' | 'angle' | null

// ── Constraint ranges ─────────────────────────────────────────────────────────
// thin_end = height - 39*tan(angle) ≥ MIN_WALL  ⇒  symmetric:
//   height ≥ MIN_WALL + 39*tan(angle)
//   angle  ≤ atan((height - MIN_WALL) / 39)
function heightRange() {
  const a   = state.angleStored;
  const min = Math.max(0, MIN_WALL + PAD_HALF_LEN * tanDeg(a));
  return { min, max: TEXT_MAX_MM };
}
function angleRange() {
  const h   = state.heightStored;
  const max = h > MIN_WALL ? Math.min(ANGLE_MAX, atanDeg((h - MIN_WALL) / PAD_HALF_LEN)) : 0;
  return { min: ANGLE_MIN, max };
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ── Recompute ─────────────────────────────────────────────────────────────────
function recompute() {
  const hR = heightRange();
  const aR = angleRange();

  state.heightEff = (dragWinner === 'height') ? state.heightStored
                                              : clamp(state.heightStored, hR.min, hR.max);
  state.angleEff  = (dragWinner === 'angle')  ? state.angleStored
                                              : clamp(state.angleStored,  aR.min, aR.max);

  // Apply to controls. Constraint-based label wins over plain "extended" —
  // if the slider value is outside its visual range AND being clamped, the
  // user wants to know about the clamp first.
  function clampReason(stored, eff, sliderMin, sliderMax) {
    if (eff > stored + 1e-4)             return 'min';
    if (eff < stored - 1e-4)             return 'max';
    if (stored > sliderMax + 1e-6 ||
        stored < sliderMin - 1e-6)       return 'extended';
    return null;
  }

  heightCtrl.applyEffective({
    effMM: state.heightEff,
    minBoundMM: hR.min > SLIDER_MIN_MM ? hR.min : null,
    maxBoundMM: null,    // no useful max marker for height in normal use
    clampReason: clampReason(state.heightStored, state.heightEff, SLIDER_MIN_MM, SLIDER_MAX_MM),
  });

  angleCtrl.applyEffective({
    effMM: state.angleEff,
    minBoundMM: null,
    maxBoundMM: aR.max < ANGLE_MAX ? aR.max : null,
    clampReason: clampReason(state.angleStored, state.angleEff, ANGLE_MIN, ANGLE_MAX),
  });

  updateStats();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
// Wedge angle thresholds: under 10° is unremarkable; 10-15° is aggressive
// (warn); above 15° is not recommended for typical setups (err). The angle
// value input flips colour as it crosses each threshold so users get an
// ambient cue while dialing — the info-icon tooltip carries the explanation.
const ANGLE_WARN_DEG = 10;
const ANGLE_ERR_DEG  = 15;

function updateStats() {
  const h     = state.heightEff;
  const a     = state.angleEff;
  const wedge = PAD_HALF_LEN * tanDeg(a);
  const thick = h + wedge;
  const thin  = h - wedge;
  const dpMM  = 1, dpIN = 3;

  document.getElementById('stat-thick').textContent  = LT.fmt.formatLen(thick, state.unit, dpMM, dpIN);
  document.getElementById('stat-center').textContent = LT.fmt.formatLen(h,     state.unit, dpMM, dpIN);
  document.getElementById('stat-thin').textContent   = LT.fmt.formatLen(thin,  state.unit, dpMM, dpIN);

  const thinClass = thin < MIN_WALL ? 'err' : 'ok';
  document.getElementById('stat-thin').className = 'stat-val ' + thinClass;

  // Angle warn/err classes on the value input (only — not the slider thumb).
  const angleVal = document.getElementById('val-angle');
  angleVal.classList.toggle('err',  a >  ANGLE_ERR_DEG);
  angleVal.classList.toggle('warn', a >  ANGLE_WARN_DEG && a <= ANGLE_ERR_DEG);

  // Display the signed angle. SliderControl always writes a positive value;
  // we prepend '-' after the fact when flipped. Guard prevents double-prepend.
  if (state.flipAngle && a > 0 && !angleVal.value.startsWith('-')) {
    angleVal.value = '-' + angleVal.value;
  }

  document.getElementById('btn-preview').disabled = false;
}

// ── Set up viewport ───────────────────────────────────────────────────────────
const viewport = LT.Viewport({
  canvas:         document.getElementById('canvas'),
  loadingOverlay: document.getElementById('loading-overlay'),
  loadingMsg:     document.getElementById('loading-msg'),
  viewportStatus: document.getElementById('viewport-status'),
  meshColor:      0xff5a1f,   // brand "octopus orange" — matches YT icon
  initialSpherical: { theta: Math.PI / 4, phi: Math.PI / 3, radius: 200 },
});

if ('ontouchstart' in window) {
  document.getElementById('viewport-hint').textContent = 'Drag to orbit · Pinch to zoom';
}

// ── Set up controls ───────────────────────────────────────────────────────────
const heightCtrl = LT.SliderControl({
  slider:      document.getElementById('slider-height'),
  valueInput:  document.getElementById('val-height'),
  minMarker:   document.getElementById('min-marker-height'),
  maxMarker:   document.getElementById('max-marker-height'),
  clampLabel:  document.getElementById('clamp-height'),
  sliderMinMM: SLIDER_MIN_MM,
  sliderMaxMM: SLIDER_MAX_MM,
  stepMM:      0.1,
  textMinMM:   TEXT_MIN_MM,
  textMaxMM:   TEXT_MAX_MM,
  initialMM:   state.heightStored,
  unit:        'mm',
  decimalsMM:  1,
  decimalsIN:  3,
  clampLabelText: { min: 'Min applied', max: 'Max applied', extended: 'Extended' },
  onInput: (mm, source) => {
    state.heightStored = mm;
    if (source === 'drag') dragWinner = 'height';
    // Type commit: clamp to current valid range (drag yields normally — the
    // riser pad's only cross-constraint (thin_end >= MIN_WALL) can't push
    // either slider's range to inversion within the visible slider bounds,
    // so there's no "brackets would cross" case to guard against here).
    if (source === 'type') {
      const r = heightRange();
      state.heightStored = clamp(state.heightStored, r.min, r.max);
      heightCtrl.setStoredMM(state.heightStored, false);
    }
    recompute();
  },
});

const angleCtrl = LT.SliderControl({
  slider:      document.getElementById('slider-angle'),
  valueInput:  document.getElementById('val-angle'),
  minMarker:   document.getElementById('min-marker-angle'),
  maxMarker:   document.getElementById('max-marker-angle'),
  clampLabel:  document.getElementById('clamp-angle'),
  sliderMinMM: ANGLE_MIN,
  sliderMaxMM: ANGLE_MAX,
  stepMM:      0.5,
  textMinMM:   ANGLE_MIN,
  textMaxMM:   ANGLE_MAX,
  initialMM:   state.angleStored,
  isAngle:     true,
  decimalsAngle: 1,
  clampLabelText: { min: 'Min applied', max: 'Max applied', extended: 'Extended' },
  onInput: (deg, source) => {
    if (source === 'drag') dragWinner = 'angle';
    if (source === 'type') {
      const r = angleRange();
      state.angleStored = clamp(deg, r.min, r.max);
      angleCtrl.setStoredMM(state.angleStored, false);
    } else {
      state.angleStored = deg;
    }
    recompute();
  },
});

// ── Typed angle intercept ────────────────────────────────────────────────────
// Problem: SliderControl clamps internally, so typing '-10' arrives in onInput
// as 0 — the negative is lost before our code sees it.
//
// Fix: track the raw typed string on every keystroke ('input' event, fires before
// SliderControl processes it). On commit, our handler fires AFTER SliderControl
// (no capture flag — same-element listeners fire in registration order, and we
// register after SliderControl). We use the tracked raw value to correct state.
//
// Two cases handled:
//   typed negative  → flip on,  override state.angleStored with magnitude
//   typed positive while flipped → flip off, state already correct from SliderControl
//
// Focus: SliderControl reformats from internal positive state on focus, wiping
// the '-' we prepended. rAF fires after that reformat, re-applying the sign.
(function () {
  const inp = document.getElementById('val-angle');
  let rawTyped = null;

  inp.addEventListener('focus', () => {
    rawTyped = null;   // clear any stale value from previous focus session
    requestAnimationFrame(() => {
      if (state.flipAngle && state.angleEff > 0 && !inp.value.startsWith('-')) {
        inp.value = '-' + inp.value;
      }
    });
  });

  // Capture every keystroke before SliderControl sees it
  inp.addEventListener('input', () => { rawTyped = inp.value; });

  function handleCommit() {
    if (rawTyped === null) return;
    const raw = rawTyped;
    rawTyped = null;

    const num = parseFloat(raw);
    if (isNaN(num)) return;

    if (num < 0) {
      // Negative typed → flip on, correct the state SliderControl clamped to 0
      state.flipAngle = true;
      updateFlipBtn();
      const mag = Math.min(-num, ANGLE_MAX);
      const r = angleRange();
      state.angleStored = clamp(mag, r.min, r.max);
      angleCtrl.setStoredMM(state.angleStored, false);
      recompute();
      state.stlBlob = null;
      document.getElementById('btn-download').disabled = true;
      runPreview(true);
    } else if (state.flipAngle) {
      // Positive typed while flipped → un-flip; SliderControl already set angleStored correctly
      state.flipAngle = false;
      updateFlipBtn();
      recompute();
      state.stlBlob = null;
      document.getElementById('btn-download').disabled = true;
      runPreview(true);
    }
  }

  // No capture flag: fires AFTER SliderControl's listeners (registration-order guarantee)
  inp.addEventListener('blur',    handleCommit);
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleCommit(); });
}());

// Click-to-promote — pointerdown on a slider thumb (no value change required)
// promotes that key to dragWinner and recomputes, so Min/Max-applied labels
// and clamped-thumb darkening reflect the click immediately rather than
// waiting for the user to move something.
heightCtrl.slider.addEventListener('pointerdown', () => {
  if (dragWinner === 'height') return;
  dragWinner = 'height';
  recompute();
});
angleCtrl.slider.addEventListener('pointerdown', () => {
  if (dragWinner === 'angle') return;
  dragWinner = 'angle';
  recompute();
});

// ── Unit toggle ───────────────────────────────────────────────────────────────
const unitToggle = LT.UnitToggle({
  mmButton: document.getElementById('btn-mm'),
  inButton: document.getElementById('btn-in'),
  initial:  'mm',
  onChange: (u) => {
    state.unit = u;
    heightCtrl.setUnit(u);   // angle is fixed deg, no-op
    recompute();
  },
});

// ── Angle flip toggle ─────────────────────────────────────────────────────────
const flipBtn = document.getElementById('btn-flip-angle');

function updateFlipBtn() {
  flipBtn.classList.toggle('flipped', state.flipAngle);
  flipBtn.setAttribute('aria-pressed', state.flipAngle);
}

flipBtn.addEventListener('click', () => {
  state.flipAngle = !state.flipAngle;
  updateFlipBtn();
  recompute();   // update display immediately before the async fetch starts
  state.stlBlob = null;
  document.getElementById('btn-download').disabled = true;
  runPreview(true);
});

// ── Style selection ───────────────────────────────────────────────────────────
function setStyle(name) {
  state.style   = name;
  state.stlBlob = null;
  document.getElementById('btn-download').disabled = true;
  runPreview(true);
}

function clearAllStyleActive() {
  document.querySelectorAll('.pattern-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.library-item').forEach(x => x.classList.remove('active'));
  document.getElementById('library-toggle').classList.remove('has-active');
}

document.querySelectorAll('.pattern-btn').forEach(b => b.addEventListener('click', () => {
  clearAllStyleActive();
  b.classList.add('active');
  setStyle(b.dataset.style);
}));

// ── Library pull-down ─────────────────────────────────────────────────────────
const libraryToggle  = document.getElementById('library-toggle');
const libraryDrawer  = document.getElementById('library-drawer');
const libraryChevron = document.getElementById('library-chevron');
const libraryList    = document.getElementById('library-list');

libraryToggle.addEventListener('click', () => {
  const open = libraryDrawer.classList.toggle('open');
  libraryChevron.classList.toggle('open', open);
  libraryToggle.setAttribute('aria-expanded', open);
});

function renderLibraryItems(names) {
  if (!names.length) {
    libraryList.innerHTML = '<span class="library-empty">No library items yet.</span>';
    return;
  }
  libraryList.innerHTML = names.map(name =>
    `<div class="library-item" role="option" data-style="${name}">${name}</div>`
  ).join('');
  libraryList.querySelectorAll('.library-item').forEach(item => {
    item.addEventListener('click', () => {
      clearAllStyleActive();
      item.classList.add('active');
      libraryToggle.classList.add('has-active');
      setStyle(item.dataset.style);
    });
  });
}

async function loadLibrary() {
  try {
    const resp  = await fetch('/api/riser-pad/library');
    const names = resp.ok ? await resp.json() : [];
    renderLibraryItems(names);
  } catch {
    renderLibraryItems([]);
  }
}

// ── Preview / Download ────────────────────────────────────────────────────────
// Cold start can happen on ANY request after ~15 min of Render idle, not
// just the first one this page load — so the hint is triggered by actual
// request latency (still pending past COLD_START_DELAY_MS) rather than a
// first-ever-success flag. The overlay itself now shows on every call,
// including manual "Preview" clicks, not just auto-triggered ones.
const COLD_START_DELAY_MS = 3000;
const COLD_START_HINT = 'Taking longer than usual — the render server may be waking up from idle (up to ~30s).';

// A request that never settles at all (dropped connection, a proxy layer
// that never times out on its own, gunicorn killing a worker past its own
// --timeout) would otherwise leave the UI stuck on "Generating…" forever —
// nothing before this ever gave up on a hung request. REQUEST_TIMEOUT_MS is
// a generous ceiling that sits under gunicorn's 60s worker timeout, so the
// client gives up cleanly before the server would kill the connection out
// from under it.
const REQUEST_TIMEOUT_MS = 45000;

// Nothing disables the sliders / type buttons / Preview button while a
// request is in flight, so clicking through styles (or hitting Preview
// again) can fire several runPreview() calls before the first resolves —
// which matters far more once a cold start stretches each round trip to
// ~30s. requestGeneration + an AbortController make the newest call always
// win: its response is the only one ever applied, and a superseded request
// is actively cancelled rather than left to finish for nothing against an
// already-strained cold-starting free-tier instance.
let requestGeneration = 0;
let currentAbortController = null;

async function runPreview(auto) {
  const btn = document.getElementById('btn-preview');
  const lbl = document.getElementById('btn-label');
  const sp  = document.getElementById('spinner');

  if (currentAbortController) currentAbortController.abort();
  const myGeneration = ++requestGeneration;
  const controller = new AbortController();
  currentAbortController = controller;
  let timedOut = false;

  btn.disabled = true; lbl.textContent = 'Generating…'; sp.classList.add('visible');
  viewport.setLoading(true, 'Generating preview…', '');
  const coldStartTimer = setTimeout(() => {
    if (myGeneration === requestGeneration) {
      viewport.setLoading(true, 'Generating preview…', COLD_START_HINT);
    }
  }, COLD_START_DELAY_MS);
  const giveUpTimer = setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, REQUEST_TIMEOUT_MS);
  try {
    const resp = await fetch('/api/riser-pad/slice', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        style:         state.style,
        center_height: state.heightEff,
        angle:         signedAngle(),
      }),
      signal: controller.signal,
    });
    if (myGeneration !== requestGeneration) return; // superseded while awaiting
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      if (!auto) alert('Error: ' + (err.error || resp.statusText));
      return;
    }
    const buf = await resp.arrayBuffer();
    if (myGeneration !== requestGeneration) return; // superseded while awaiting
    state.stlBlob = buf;
    viewport.loadSTL(buf);
    document.getElementById('btn-download').disabled = false;
    LT.logEvent({ type: 'preview', tool: 'riser-pad' });
  } catch (e) {
    if (e.name === 'AbortError') {
      if (timedOut && myGeneration === requestGeneration) {
        viewport.setLoading(true, 'Still not responding…', 'This is taking much longer than expected. Try Preview again in a moment.');
      }
      return; // superseded or timed out — not a normal failure
    }
    if (!auto) alert('Request failed: ' + e.message);
  } finally {
    clearTimeout(coldStartTimer);
    clearTimeout(giveUpTimer);
    if (myGeneration === requestGeneration) {
      btn.disabled = false; lbl.textContent = 'Preview'; sp.classList.remove('visible');
      if (!timedOut) viewport.setLoading(false);
    }
  }
}

document.getElementById('btn-preview').addEventListener('click', () => runPreview(false));

document.getElementById('btn-download').addEventListener('click', () => {
  if (!state.stlBlob) return;
  const a  = document.createElement('a');
  const hs = state.heightEff.toFixed(1).replace('.', 'p') + 'mm';
  const styleSlug = state.style.toLowerCase().replace(/\s+/g, '_');
  const sa  = signedAngle();
  const as  = sa.toFixed(1).replace('.', 'p') + 'deg';  // e.g. -10p0deg
  a.download = `riser_${styleSlug}_${as}_${hs}.stl`;
  a.href = URL.createObjectURL(new Blob([state.stlBlob], { type: 'application/octet-stream' }));
  a.click();
  URL.revokeObjectURL(a.href);

  LT.logEvent({
    type: 'download',
    tool: 'riser-pad',
    unit: state.unit,
    params: {
      style:         state.style,
      center_height: +state.heightEff.toFixed(3),
      angle:         +signedAngle().toFixed(3),
    },
  });
});

// ── Mission report ────────────────────────────────────────────────────────────
document.getElementById('btn-feedback').addEventListener('click', () => {
  const { style, heightEff: h, unit } = state;
  const params = {
    'Style':         style,
    'Center height': LT.fmt.formatLen(h, unit, 1, 3),
    'Wedge angle':   signedAngle().toFixed(1) + '°',
  };
  LT.openFeedback({ tool: 'Riser Pad', params });
});

// ── Boot ──────────────────────────────────────────────
recompute();
loadLibrary();

</script>
</body>
</html>
